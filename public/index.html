<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sāndhya — An Evening in the Village</title>
<meta name="description" content="A cinematic, ambient journey back to an old Indian village at dusk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Assistant:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ CINEMATIC BACKGROUND ============ -->
  <div id="bg-layer" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>

  <!-- ============ ENTRY OVERLAY ============ -->
  <div id="entry-overlay" role="dialog" aria-modal="true" aria-labelledby="entry-title">
    <div class="entry-content">
      <p class="entry-eyebrow">एक संध्या • an evening remembered</p>
      <h1 id="entry-title">Sāndhya</h1>
      <p class="entry-sub">A quiet corner of an old village, held in light and sound.</p>

      <button id="enter-btn" class="diya-button" aria-label="Light the lamp and enter the experience">
        <span class="diya-flame" aria-hidden="true">
          <span class="flame-core"></span>
          <span class="flame-glow"></span>
        </span>
        <span class="diya-base" aria-hidden="true"></span>
      </button>

      <p class="entry-hint">Touch the flame to enter</p>
    </div>
  </div>

  <!-- ============ MAIN EXPERIENCE ============ -->
  <main id="experience" aria-hidden="true">

    <!-- Settings toggle -->
    <button id="settings-toggle" class="icon-button" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-panel" title="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3a7.97 7.97 0 00-.16-1.6l2.02-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.38.96a8 8 0 00-1.38-.8l-.36-2.54A.5.5 0 0015.8 1h-3.84a.5.5 0 00-.5.43l-.36 2.54a8 8 0 00-1.38.8l-2.38-.96a.5.5 0 00-.6.22L4.94 7.35a.5.5 0 00.12.64L7.08 9.57a8.1 8.1 0 000 3.2l-2.02 1.58a.5.5 0 00-.12.64l1.92 3.32a.5.5 0 00.6.22l2.38-.96c.42.33.89.6 1.38.8l.36 2.54a.5.5 0 00.5.43h3.84a.5.5 0 00.5-.43l.36-2.54c.49-.2.96-.47 1.38-.8l2.38.96a.5.5 0 00.6-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.02-1.58c.1-.52.16-1.06.16-1.6z" fill="currentColor"/></svg>
      <span class="visually-hidden">Open settings</span>
    </button>

    <!-- Settings panel -->
    <section id="settings-panel" class="glass-panel" role="dialog" aria-label="Experience settings" hidden>
      <div class="panel-header">
        <h2>Settings</h2>
        <button id="settings-close" class="icon-button small" aria-label="Close settings">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="setting-row">
        <label for="music-volume-setting">Music volume</label>
        <input type="range" id="music-volume-setting" min="0" max="100" value="70" aria-describedby="music-vol-val">
        <span id="music-vol-val" class="setting-val">70%</span>
      </div>

      <div class="setting-row">
        <label for="ambient-volume-setting">Ambience volume</label>
        <input type="range" id="ambient-volume-setting" min="0" max="100" value="22" aria-describedby="ambient-vol-val">
        <span id="ambient-vol-val" class="setting-val">22%</span>
      </div>

      <div class="setting-row toggle-row">
        <label for="ambient-toggle">Ambient village sounds</label>
        <button id="ambient-toggle" class="toggle-switch" role="switch" aria-checked="true">
          <span class="toggle-knob" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <!-- Toast / error message -->
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Music Player -->
    <section id="music-player" class="glass-panel" aria-label="Music player">
      <div class="player-header">
        <span class="player-note" aria-hidden="true">♪</span>
        <span class="player-label">Now playing</span>
      </div>

      <p id="song-name" class="song-name">—</p>

      <div class="player-controls">
        <button id="prev-btn" class="control-btn" aria-label="Previous song" title="Previous song">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6v12M18 6l-9 6 9 6V6z" fill="currentColor"/></svg>
        </button>

        <button id="play-pause-btn" class="control-btn primary" aria-label="Pause music" title="Play or pause">
          <svg id="icon-pause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
          <svg id="icon-play" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" hidden><path d="M8 5v14l11-7L8 5z" fill="currentColor"/></svg>
        </button>

        <button id="next-btn" class="control-btn" aria-label="Next song" title="Next song">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M18 6v12M6 6l9 6-9 6V6z" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="volume-row">
        <button id="mute-btn" class="icon-button small" aria-label="Mute music" title="Mute or unmute">
          <svg id="icon-vol-on" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
          <svg id="icon-vol-off" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" hidden><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <input type="range" id="music-volume" min="0" max="100" value="70" aria-label="Music volume">
      </div>

      <button id="playlist-toggle" class="text-link" aria-haspopup="listbox" aria-expanded="false" aria-controls="playlist">
        Choose a song
      </button>
      <ul id="playlist" role="listbox" aria-label="Song list" hidden></ul>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
